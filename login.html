<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin · Peta Kesehatan Inhu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Security headers (enforced by hosting provider when served over HTTPS) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://*.supabase.co https://api.groq.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Strict-Transport-Security" content="max-age=63072000; includeSubDomains; preload">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Header -->
    <div class="login-head">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png" alt="Lambang Kab. Indragiri Hulu" class="logo">
      <h1>Login Admin Dinas Kesehatan</h1>
      <p>Kabupaten Indragiri Hulu · Provinsi Riau</p>
    </div>

    <!-- Form -->
    <form class="login-body" id="loginForm">
      <div id="loginError" class="alert alert-error hidden"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" required autofocus
               placeholder="nama@dinkes.go.id" autocomplete="email" maxlength="100">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" required
               placeholder="••••••••" autocomplete="current-password" maxlength="128" minlength="8">
        <div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">Minimal 8 karakter</div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
        Masuk ke Dashboard
      </button>

      <p class="login-hint">Khusus petugas resmi Dinas Kesehatan Kabupaten Indragiri Hulu</p>

      <div class="login-credentials-info">
        Hubungi Super Admin untuk mendapatkan akun.
      </div>
    </form>

    <!-- Footer -->
    <div class="login-foot">
      <a href="index.html">← Kembali ke peta publik</a>
    </div>
  </div>

  <!-- ============== SCRIPTS ============== -->
  <!-- SRI hashes must be computed before deployment. See README.md for instructions. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.js" integrity="sha384-{COMPUTE_HASH}" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
