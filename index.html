<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Peta Kesehatan Kabupaten Indragiri Hulu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistem Informasi Peta Sebaran Data Kesehatan Kabupaten Indragiri Hulu - Dinas Kesehatan">
  <meta name="author" content="Dinas Kesehatan Kabupaten Indragiri Hulu">
  <!-- Security headers (enforced by hosting provider when served over HTTPS) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://*.supabase.co https://api.groq.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <!-- CATATAN: X-Frame-Options, X-Content-Type-Options, Permissions-Policy, dan
       Strict-Transport-Security TIDAK berfungsi lewat tag <meta> -- browser hanya
       menghormatinya jika dikirim sebagai HTTP response header asli oleh server/CDN.
       Mengisinya di sini hanya akan memunculkan warning konsol tanpa proteksi nyata
       (persis error yang pernah muncul: "X-Frame-Options may only be set via an
       HTTP header"). Header ini sudah dikonfigurasi di vercel.json / _headers
       (Netlify) di root proyek -- pastikan salah satunya ikut ter-deploy.
       Referrer-Policy DIPERTAHANKAN di bawah karena itu satu-satunya yang memang
       didukung lewat <meta> sesuai spesifikasi. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <!-- Hash SRI di bawah diambil dari leafletjs.com/download.html (dipublikasikan resmi
       oleh maintainer Leaflet untuk URL unpkg persis ini) — bukan hasil tebakan. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body class="map-page">

  <!-- ============== HEADER ============== -->
  <header class="gov-header">
    <div class="htext">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png" alt="Lambang Kabupaten Indragiri Hulu" class="logo">
      <div>
        <h1>PETA SEBARAN DATA KESEHATAN</h1>
        <p>Kabupaten Indragiri Hulu · Dinas Kesehatan · Provinsi Riau</p>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#059669"></span>Risiko Rendah</div>
      <div class="legend-item"><span class="legend-dot" style="background:#d97706"></span>Risiko Sedang</div>
      <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span>Risiko Tinggi</div>
    </div>
  </header>

  <!-- ============== MAP ============== -->
  <div id="map">
    <div class="loading-overlay" id="mapLoading">
      <div>
        <div class="spinner spinner-lg" style="margin: 0 auto 12px; border-color: white; border-top-color: transparent;"></div>
        <p>Memuat peta...</p>
      </div>
    </div>
  </div>

  <!-- ============== AI CHAT FLOATING BUTTON ============== -->
  <button class="chat-fab" id="chatFab" title="Tanya AI Dinkes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <span>Tanya AI</span>
  </button>

  <!-- ============== DISTRICT DETAIL PANEL (placeholder) ============== -->
  <div id="detailPanelContainer"></div>

  <!-- ============== AI CHAT WIDGET (placeholder) ============== -->
  <div id="chatWidgetContainer"></div>

  <!-- ============== SCRIPTS ============== -->
  <!-- SRI hashes must be computed before deployment. See README.md for instructions. -->
  <!-- TODO (WAJIB sebelum produksi): tambahkan atribut integrity setelah menghitung
       hash SRI asli untuk file INI PERSIS (lihat README bagian "Compute SRI Hashes").
       Sengaja TIDAK diisi placeholder palsu: integrity yang salah/rusak membuat
       browser MENOLAK memuat script ini sama sekali (lihat Troubleshooting README). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <!-- App JS -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
