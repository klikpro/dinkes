<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Peta Kesehatan Kabupaten Indragiri Hulu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d9488; --teal-dk:#065f46; --emerald:#10b981;
    --amber:#f59e0b; --rose:#e11d48; --ink:#0f172a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
  h1,h2,h3,h4{font-family:'Poppins',sans-serif}
  body{background:radial-gradient(ellipse at top,#0b3d34 0%,#04120f 60%,#020806 100%);overflow:hidden}

  /* ---------- HEADER ---------- */
  #header{
    position:relative; z-index:500;
    background:linear-gradient(120deg,rgba(6,95,70,.92),rgba(13,148,136,.92));
    backdrop-filter:blur(8px);
    color:#fff; padding:18px 28px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.15);
  }
  #header .htext h1{font-size:21px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  #header .htext p{font-size:12.5px;opacity:.88;margin-top:4px}
  #legend{
    display:flex; gap:14px; background:rgba(255,255,255,.12); padding:8px 14px;
    border-radius:999px; border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(6px);
  }
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#fff}
  .legend-dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.4)}

  #map{height:calc(100vh - 76px);width:100%}

  /* ---------- MARKERS ---------- */
  .pulse-wrap{position:relative;width:0;height:0}
  .pulse-ring{
    position:absolute; left:-16px; top:-16px; width:32px; height:32px; border-radius:50%;
    animation:pulse 2.2s ease-out infinite; opacity:.7;
  }
  @keyframes pulse{0%{transform:scale(.4);opacity:.75}100%{transform:scale(2.1);opacity:0}}

  /* ---------- POPUP ---------- */
  .leaflet-popup-content-wrapper{border-radius:14px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.35); padding:0}
  .leaflet-popup-content{margin:0; width:auto !important}
  .leaflet-popup-tip{background:#fff}
  .popup-box{min-width:220px}
  .popup-head{background:linear-gradient(120deg,var(--teal-dk),var(--teal));padding:12px 16px;color:#fff}
  .popup-head h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .popup-head span.tag{display:block;font-size:10.5px;opacity:.85;font-weight:400;margin-top:2px}
  .popup-rows{padding:10px 16px 12px}
  .popup-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #e5e7eb}
  .popup-row:last-of-type{border-bottom:none}
  .popup-row .lbl{display:flex;align-items:center;gap:6px;color:#475569;font-weight:500}
  .popup-row b{color:#0f172a;font-size:13px}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:11px;color:#fff}
  .b-tb{background:#dc2626}.b-hamil{background:#db2777}.b-stunt{background:#d97706}
  .popup-hint{font-size:10.5px;color:var(--teal);margin-top:8px;font-style:italic;text-align:center;font-weight:600}

  /* ---------- MODAL ---------- */
  #modalOverlay{display:none;position:fixed;inset:0;background:rgba(2,8,6,.72);backdrop-filter:blur(3px);z-index:2000;align-items:center;justify-content:center;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #modalBox{background:#fff;width:min(600px,92vw);max-height:88vh;overflow-y:auto;border-radius:18px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  #modalHead{background:linear-gradient(120deg,var(--teal-dk),var(--teal) 60%,#14b8a6);color:#fff;padding:24px 28px;border-radius:18px 18px 0 0;position:relative;overflow:hidden}
  #modalHead::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:rgba(255,255,255,.08);border-radius:50%}
  #modalHead h2{font-size:22px;font-weight:700;position:relative}
  #modalHead p{font-size:12.5px;opacity:.85;margin-top:4px;position:relative}
  #closeBtn{position:absolute;top:16px;right:18px;cursor:pointer;font-size:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;transition:.15s}
  #closeBtn:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}
  .modal-body{padding:22px 28px}
  .section{margin-bottom:20px}
  .section h4{font-size:13.5px;color:var(--teal-dk);margin-bottom:10px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .section h4::after{content:"";flex:1;height:1px;background:#e2e8f0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  tr{transition:.15s}
  tr:hover td{background:#f8fafc}
  td{padding:8px 6px;border-bottom:1px solid #f1f5f9}
  td:first-child{color:#64748b}
  td:last-child{text-align:right;font-weight:700;color:#0f172a}
  .stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .stat-card{background:linear-gradient(160deg,#f0fdf4,#ecfeff);border-radius:12px;padding:14px 8px;text-align:center;border:1px solid #d1fae5;position:relative;overflow:hidden}
  .stat-card .num{font-size:24px;font-weight:800;color:var(--teal-dk);font-family:'Poppins',sans-serif}
  .stat-card .lbl{font-size:10.5px;color:#64748b;margin-top:3px;font-weight:600}
  .footnote{font-size:10.5px;color:#94a3b8;text-align:center;padding:12px;border-top:1px solid #f1f5f9}

  .leaflet-control-zoom{border-radius:10px !important;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3) !important}
</style>
</head>
<body>

<div id="header">
  <div class="htext">
    <h1>🗺️ Peta Sebaran Data Kesehatan Kabupaten Indragiri Hulu</h1>
    <p>Hover titik kecamatan untuk ringkasan • klik untuk detail lengkap ✦ data contoh/dummy</p>
  </div>
  <div id="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#059669"></span>Risiko Rendah</div>
    <div class="legend-item"><span class="legend-dot" style="background:#d97706"></span>Risiko Sedang</div>
    <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span>Risiko Tinggi</div>
  </div>
</div>
<div id="map"></div>

<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalHead">
      <button id="closeBtn" onclick="closeModal()">×</button>
      <h2 id="mTitle">Kecamatan</h2>
      <p id="mSub">Kabupaten Indragiri Hulu, Riau</p>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="footnote">Data bersifat ilustratif/dummy — belum data resmi Dinas Kesehatan.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// Data 14 kecamatan Indragiri Hulu, koordinat perkiraan
const data = [
 {n:"Rengat", lat:-0.4053, lng:102.5606, tb:12, hamil:145, stunt:34},
 {n:"Rengat Barat", lat:-0.3720, lng:102.4900, tb:8, hamil:98, stunt:21},
 {n:"Kuala Cenaku", lat:-0.3300, lng:102.6700, tb:5, hamil:60, stunt:15},
 {n:"Pasir Penyu", lat:-0.2500, lng:102.3800, tb:10, hamil:120, stunt:28},
 {n:"Lirik", lat:-0.2300, lng:102.2900, tb:7, hamil:88, stunt:19},
 {n:"Sungai Lala", lat:-0.1600, lng:102.2500, tb:6, hamil:75, stunt:17},
 {n:"Rakit Kulim", lat:-0.1100, lng:102.1500, tb:9, hamil:102, stunt:25},
 {n:"Batang Gansal", lat:-0.1500, lng:102.0300, tb:11, hamil:110, stunt:30},
 {n:"Seberida", lat:-0.4800, lng:102.1200, tb:14, hamil:160, stunt:40},
 {n:"Batang Cenaku", lat:-0.4300, lng:102.2200, tb:9, hamil:95, stunt:23},
 {n:"Peranap", lat:-0.4000, lng:101.9200, tb:13, hamil:130, stunt:35},
 {n:"Kelayang", lat:-0.3000, lng:102.5000, tb:6, hamil:70, stunt:16},
 {n:"Lubuk Batu Jaya", lat:-0.2000, lng:102.4300, tb:5, hamil:58, stunt:14},
 {n:"Batang Peranap", lat:-0.4600, lng:101.8000, tb:8, hamil:90, stunt:22},
];

const map = L.map('map', {minZoom:9, maxZoom:16}).setView([-0.30, 102.30], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:16
}).addTo(map);

// --- Poligon perkiraan batas Kabupaten Indragiri Hulu (approx, bukan data BIG resmi) ---
const inhuBoundary = [
  [0.05,102.05],[0.02,102.20],[0.06,102.38],[0.00,102.55],[-0.05,102.68],
  [-0.15,102.72],[-0.28,102.70],[-0.33,102.60],[-0.30,102.50],[-0.38,102.45],
  [-0.45,102.48],[-0.52,102.38],[-0.55,102.25],[-0.50,102.10],[-0.44,101.95],
  [-0.38,101.78],[-0.28,101.72],[-0.18,101.75],[-0.10,101.85],[-0.02,101.92],
  [0.05,102.05]
];

// Mask: seluruh dunia dikurangi area Inhu -> area luar jadi gelap/tersembunyi
const worldRing = [[-85,-360],[-85,360],[85,360],[85,-360]];
L.polygon([worldRing, inhuBoundary.slice().reverse()], {
  stroke:false, fillColor:"#0f172a", fillOpacity:0.92, interactive:false
}).addTo(map);

// Garis batas kabupaten
L.polygon(inhuBoundary, {
  color:"#facc15", weight:2.5, fill:false, dashArray:"6,4"
}).addTo(map).bindTooltip("Batas Kabupaten Indragiri Hulu (perkiraan)", {sticky:true});

map.setMaxBounds([[-0.75,101.55],[0.25,102.95]]);
map.fitBounds(inhuBoundary, {padding:[20,20]});

function riskColor(v,th1,th2){ return v>=th2?"#dc2626": v>=th1?"#d97706":"#059669"; }
function riskLabel(v,th1,th2){ return v>=th2?"Tinggi": v>=th1?"Sedang":"Rendah"; }

data.forEach(d=>{
  const color = riskColor(d.stunt,18,30);
  const icon = L.divIcon({
    className:'',
    html:`<div class="pulse-wrap">
            <div class="pulse-ring" style="background:${color}"></div>
            <div style="position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
                 background:${color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>
          </div>`,
    iconSize:[0,0]
  });
  const marker = L.marker([d.lat,d.lng], {icon}).addTo(map);

  const popupHtml = `
    <div class="popup-box">
      <div class="popup-head">
        <h3>📍 ${d.n}</h3>
        <span class="tag">Tingkat risiko: ${riskLabel(d.stunt,18,30)}</span>
      </div>
      <div class="popup-rows">
        <div class="popup-row"><span class="lbl"><span class="badge b-tb">TB</span>Pasien TB</span><b>${d.tb} org</b></div>
        <div class="popup-row"><span class="lbl"><span class="badge b-hamil">🤰</span>Ibu Hamil</span><b>${d.hamil} org</b></div>
        <div class="popup-row"><span class="lbl"><span class="badge b-stunt">📏</span>Stunting</span><b>${d.stunt} anak</b></div>
        <div class="popup-hint">✨ Klik titik untuk detail lengkap</div>
      </div>
    </div>`;
  marker.bindPopup(popupHtml, {closeButton:false});
  marker.bindTooltip(d.n, {permanent:false, direction:'top', offset:[0,-10]});

  marker.on('mouseover', function(){ this.openPopup(); });
  marker.on('click', function(){ openModal(d); });
});

function openModal(d){
  document.getElementById('mTitle').innerText = "📍 Kecamatan " + d.n;
  document.getElementById('mSub').innerText = `Kabupaten Indragiri Hulu, Riau · Tingkat risiko: ${riskLabel(d.stunt,18,30)}`;
  document.getElementById('mBody').innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><div class="num">${d.tb}</div><div class="lbl">Pasien TB Aktif</div></div>
      <div class="stat-card"><div class="num">${d.hamil}</div><div class="lbl">Ibu Hamil Terdata</div></div>
      <div class="stat-card"><div class="num">${d.stunt}</div><div class="lbl">Kasus Stunting</div></div>
    </div>

    <div class="section">
      <h4>🫁 Detail Data TB</h4>
      <table>
        <tr><td>Kasus baru bulan ini</td><td>${Math.round(d.tb*0.25)}</td></tr>
        <tr><td>Dalam pengobatan</td><td>${Math.round(d.tb*0.7)}</td></tr>
        <tr><td>Sembuh (kumulatif tahun ini)</td><td>${Math.round(d.tb*1.8)}</td></tr>
        <tr><td>TB Anak</td><td>${Math.round(d.tb*0.15)}</td></tr>
        <tr><td>Kepatuhan minum obat</td><td>${88+ (d.tb%7)}%</td></tr>
      </table>
    </div>

    <div class="section">
      <h4>🤰 Detail Data Ibu Hamil</h4>
      <table>
        <tr><td>Trimester 1</td><td>${Math.round(d.hamil*0.3)}</td></tr>
        <tr><td>Trimester 2</td><td>${Math.round(d.hamil*0.35)}</td></tr>
        <tr><td>Trimester 3</td><td>${Math.round(d.hamil*0.35)}</td></tr>
        <tr><td>Risiko tinggi (KEK/Anemia)</td><td>${Math.round(d.hamil*0.12)}</td></tr>
        <tr><td>Kunjungan K4 lengkap</td><td>${75+(d.hamil%15)}%</td></tr>
      </table>
    </div>

    <div class="section">
      <h4>📏 Detail Data Stunting</h4>
      <table>
        <tr><td>Stunting berat (severely stunted)</td><td>${Math.round(d.stunt*0.3)}</td></tr>
        <tr><td>Stunting sedang</td><td>${Math.round(d.stunt*0.7)}</td></tr>
        <tr><td>Balita ditimbang bulan ini</td><td>${d.stunt*6}</td></tr>
        <tr><td>Prevalensi stunting</td><td>${(d.stunt/ (d.stunt*5) *100).toFixed(1)}%</td></tr>
        <tr><td>Dapat PMT (Pemberian Makanan Tambahan)</td><td>${Math.round(d.stunt*0.85)}</td></tr>
      </table>
    </div>
  `;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){ document.getElementById('modalOverlay').style.display='none'; }
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});
</script>
</body>
</html>
