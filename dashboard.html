<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin · Peta Kesehatan Inhu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Security headers (enforced by hosting provider when served over HTTPS) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://*.supabase.co https://api.groq.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Strict-Transport-Security" content="max-age=63072000; includeSubDomains; preload">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-page">

  <!-- ============== HEADER ============== -->
  <header class="dash-header">
    <div class="bar">
      <div class="brand">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/Lambang_Kab_Indragiri_Hulu.png" alt="Lambang Inhu" class="logo">
        <div>
          <h1>Dashboard Admin · Dinas Kesehatan</h1>
          <p>Kabupaten Indragiri Hulu · Provinsi Riau</p>
        </div>
      </div>
      <div class="user-info">
        <a href="index.html" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="text-decoration:none;">🌐 Lihat Halaman Depan</a>
        <div class="hidden md:block">
          <div class="name" id="userName">-</div>
          <div class="email" id="userEmail">-</div>
        </div>
        <div class="role-chip" id="roleChip">-</div>
        <button class="btn btn-secondary" id="changePwdBtn" type="button">🔑 Ganti Password</button>
        <button class="btn-logout" id="logoutBtn">Keluar</button>
      </div>
    </div>
  </header>

  <!-- ============== TAB BAR ============== -->
  <nav class="dash-tabs">
    <div class="inner" id="tabBar">
      <!-- Tabs diisi oleh JS (dashboard.js) -->
    </div>
  </nav>

  <!-- ============== MAIN CONTENT ============== -->
  <main class="dash-main">
    <div class="container" id="tabContent">
      <!-- Konten tab diisi oleh JS -->
      <div class="text-center" style="padding: 60px 20px; color: #94a3b8;">
        <div class="spinner spinner-lg" style="margin: 0 auto 12px;"></div>
        <p>Memuat dashboard...</p>
      </div>
    </div>
  </main>

  <!-- ============== FOOTER ============== -->
  <footer class="dash-footer">
    © <span id="currentYear"></span> Dinas Kesehatan · Pemerintah Kabupaten Indragiri Hulu
  </footer>

  <!-- ============== MODAL CONTAINER ============== -->
  <div id="modalContainer"></div>

  <!-- ============== SCRIPTS ============== -->
  <!-- SRI hashes must be computed before deployment. See README.md for instructions. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.js" integrity="sha384-{COMPUTE_HASH}" crossorigin="anonymous"></script>
  <!-- SheetJS untuk Excel import/export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-{COMPUTE_HASH}" crossorigin="anonymous"></script>
  <!-- App JS -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
